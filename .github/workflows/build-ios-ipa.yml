name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build web bundle and sync Capacitor iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Resolve Xcode schemes and SPM dependencies
        run: |
          xcodebuild -list -project ios/App/App.xcodeproj
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Build signed IPA (when Apple signing secrets are configured)
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build-ios
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > build-ios/cert.p12
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > build-ios/profile.mobileprovision

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "temp-pass" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temp-pass" "$KEYCHAIN_PATH"
          security import build-ios/cert.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp-pass" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i build-ios/profile.mobileprovision)")
          cp build-ios/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > build-ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build-ios/App.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

          xcodebuild -exportArchive \
            -archivePath build-ios/App.xcarchive \
            -exportOptionsPlist build-ios/ExportOptions.plist \
            -exportPath build-ios/export

          cp build-ios/export/*.ipa build-ios/LittleLegends-signed.ipa

      - name: Build unsigned IPA (fallback when no signing secrets exist)
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 == '' || secrets.APPLE_PROVISIONING_PROFILE_BASE64 == '' }}
        run: |
          mkdir -p build-ios/Payload
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build-ios/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

          cp -R build-ios/App.xcarchive/Products/Applications/App.app build-ios/Payload/App.app
          (cd build-ios && zip -qry LittleLegends-unsigned.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-legends-ios-ipa
          path: build-ios/*.ipa
          if-no-files-found: error
